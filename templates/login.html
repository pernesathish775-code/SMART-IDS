<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Smart Identity Detection System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"/>
</head>
<body class="login-body d-flex align-items-center justify-content-center">
<div class="login-card card p-4 shadow-lg">
  <!-- Branding -->
  <div class="text-center mb-4">
    <i class="bi bi-shield-lock-fill login-icon"></i>
    <h4 class="mt-2 fw-bold text-cyan">SMART IDENTITY DETECTION SYSTEM</h4>
    <p class="text-muted small">Facial Recognition and Security Monitoring</p>
  </div>

  <!-- Flash messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <!-- Login form -->
  <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <div class="mb-3">
      <label class="form-label text-light">Username</label>
      <div class="input-group">
        <span class="input-group-text bg-dark border-secondary">
          <i class="bi bi-person text-muted"></i>
        </span>
        <input type="text" name="username" class="form-control bg-dark text-light border-secondary"
               placeholder="Enter username" required autofocus/>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label text-light">Password</label>
      <div class="input-group">
        <span class="input-group-text bg-dark border-secondary">
          <i class="bi bi-lock text-muted"></i>
        </span>
        <input type="password" name="password" id="passwordField"
               class="form-control bg-dark text-light border-secondary"
               placeholder="Enter password" required/>
        <button type="button" class="btn btn-outline-secondary"
                onclick="togglePwd()" id="toggleBtn">
          <i class="bi bi-eye" id="eyeIcon"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="btn btn-cyan w-100 mt-2">
      <i class="bi bi-box-arrow-in-right me-2"></i>Login
    </button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePwd() {
  const f = document.getElementById("passwordField");
  const i = document.getElementById("eyeIcon");
  if (f.type === "password") {
    f.type = "text";
    i.className = "bi bi-eye-slash";
  } else {
    f.type = "password";
    i.className = "bi bi-eye";
  }
}
</script>
</body>
</html>
