<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>First-Time Setup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"/>
</head>
<body class="login-body d-flex align-items-center justify-content-center">
<div class="login-card card p-4 shadow-lg">
  <div class="text-center mb-4">
    <i class="bi bi-shield-lock-fill login-icon"></i>
    <h5 class="mt-2 fw-bold text-cyan">First-Time Setup</h5>
    <p class="text-muted small">Create the administrator account</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="mb-3">
      <label class="form-label text-light">Username</label>
      <input type="text" name="username" class="form-control bg-dark text-light border-secondary"
             placeholder="admin" required autofocus/>
    </div>
    <div class="mb-3">
      <label class="form-label text-light">Password <small class="text-muted">(min 8 characters)</small></label>
      <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required/>
    </div>
    <div class="mb-3">
      <label class="form-label text-light">Confirm Password</label>
      <input type="password" name="confirm" class="form-control bg-dark text-light border-secondary" required/>
    </div>
    <button type="submit" class="btn btn-cyan w-100">Create Admin Account</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
